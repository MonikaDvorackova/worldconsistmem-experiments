[project]
name = "worldconsistmem"
version = "0.1.0"
description = "WorldConsistMem: cross-query consistency benchmark over evolving synthetic worlds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local LLM reader used by the pilot (Apple Silicon only).
llm = [
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# API-backed readers (future de-flooring probe / definitive study).
api = [
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldconsistmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
